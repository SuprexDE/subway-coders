pluginGroup=de.suprexdev
pluginVersion=1.1.1

# Target IDE: IntelliJ IDEA (unified distribution since 2025.3).
# platformVersion must be a published build.
platformVersion=2026.1.3

# Compatibility lower bound (build number). 222 = 2022.2.
# No upper bound is set on purpose (see build.gradle.kts ideaVersion).
pluginSinceBuild=222

org.gradle.jvmargs=-Xmx2g -XX:+UseParallelGC
org.gradle.caching=true
# The IntelliJ Platform already ships the Kotlin stdlib, so don't bundle our own.
kotlin.stdlib.default.dependency=false
