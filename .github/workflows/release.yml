name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version bump (ignored if 'version' is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version, e.g. 1.2.0 (optional — overrides 'bump')"
        type: string
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute new version
        id: version
        run: |
          current="$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)"
          input="${{ inputs.version }}"
          if [ -n "$input" ]; then
            new="$input"
          else
            IFS='.' read -r major minor patch <<< "$current"
            case "${{ inputs.bump }}" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            new="$major.$minor.$patch"
          fi
          echo "Bumping $current -> $new"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Bump pluginVersion
        run: sed -i "s/^pluginVersion=.*/pluginVersion=${{ steps.version.outputs.new }}/" gradle.properties

      - name: Patch changelog
        run: ./gradlew patchChangelog

      - name: Extract release notes
        run: ./gradlew getChangelog --no-header --no-summary -q --console=plain --output-file release-notes.md

      - name: Sign and publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Commit version bump and changelog, then tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties CHANGELOG.md
          git commit -m "Release ${{ steps.version.outputs.new }}"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.new }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.new }}" \
            --title "${{ steps.version.outputs.new }}" \
            --notes-file release-notes.md \
            build/distributions/*.zip
